[build-system]
requires = ["setuptools>=75.8.1", "Cython", "numpy"]
build-backend = "setuptools.build_meta"

[project]
name = "surface-ion"
description = "Python package for simulation and analysis of ion crystals in surface traps."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.9"
version = "1.1.0"
dependencies = [
    "numpy>=1.23",
    "cython>=3.0",
    "jinja2>=2.9.6",
    "scipy>=1.12",
    "h5py>=2.7.0",
    "termcolor>=1.1.0",
    "scikit-optimize>=0.10.2",
    "matplotlib>=3.0",
    "gdspy>=1.6",
    "shapely>=2.0",
    "tqdm>=4.66",
    "nose>=1.0",
    "sphinx>=8.0",
    "numpydoc>=1.0",
    "cvxopt>=1",
#    "mayavi>=4",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: POSIX",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.9",
    "Topic :: Scientific/Engineering :: Physics",
]
[[project.maintainers]]
name = "Artem Podlesnyy"
email = "a.podlesnyy@rqc.ru"

[project.urls]
repository = "https://github.com/underforestaaa/Sion"

[tool.setuptools]
packages = ["sion", "sion.electrode", "sion.pylion"]
include-package-data = true
py-modules = []
